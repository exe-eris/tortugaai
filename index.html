<!doctype html>
<html lang="en">

<style>
:root{--bg:#0b1020;--fg:#e8ecf8;--acc:#39d98a;--mut:#93a0c4}

body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:760px;margin:0 auto;padding:12vh 24px}

</head>
<body>
<main>
  <div class="tag">TortugaAI</div>

    <p>Placeholder landing page. Replace this content with the real TortugaAI site when ready.</p>
